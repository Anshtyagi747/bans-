{% extends "base.html" %}{% block content %}<section class="auth-wrap"><form method="post" class="auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">WELCOME TO B BANS</p><h1>{{ mode }}</h1>{% if mode=='Create account' %}<label>Full name<input name="name" required autocomplete="name"></label>{% endif %}<label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="10" autocomplete="current-password"></label><button class="btn">{{ mode }}</button><p>{% if mode=='Sign in' %}New to BANS? <a href="{{ url_for('auth.register') }}">Create an account</a>{% else %}Already a member? <a href="{{ url_for('auth.login') }}">Sign in</a>{% endif %}</p></form></section>{% endblock %}
