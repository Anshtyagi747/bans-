<article class="product-card"><a href="{{ url_for('product',slug=p.slug) }}"><div class="product-visual">{% if p.image %}<img class="product-photo" src="{{ url_for('static',filename=p.image) }}" alt="{{ p.name }}">{% else %}<div class="mini-bottle"><span>BANS</span></div>{% endif %}{% if p.discount %}<span class="product-tag">{{ p.discount }}% OFF</span>{% endif %}</div><div class="product-info"><div><h3>{{ p.name }}</h3><p>{{ p.gender }} · Eau de Parfum</p></div><strong>₹{{ '%.0f'|format(p.price) }}</strong></div></a><form method="post" action="{{ url_for('add_to_cart',product_id=p.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="add-link">ADD TO BAG +</button></form></article>
