{% extends "admin/layout.html" %}{% block admin_content %}<div class="admin-heading"><div><p class="eyebrow">STOCK CONTROL</p><h1>Inventory <em>desk.</em></h1></div></div><section class="admin-panel"><table><tr><th>Product</th><th>SKU / ID</th><th>Stock</th><th>Update stock</th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>#{{ p.id }}</td><td><span class="status-pill {{ 'inactive' if p.stock <= 5 else 'active' }}">{{ p.stock }} units</span></td><td><form method="post" class="status-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="product_id" value="{{ p.id }}"><input type="number" name="stock" min="0" value="{{ p.stock }}" class="qty"><button class="text-link">Save</button></form></td></tr>{% else %}<tr><td colspan="4">No products found.</td></tr>{% endfor %}</table></section>{% endblock %}
