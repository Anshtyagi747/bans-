{% extends "admin/layout.html" %}{% block admin_content %}<section class="auth-wrap"><form method="post" enctype="multipart/form-data" class="auth-card wide-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">CATALOGUE MANAGEMENT</p><h1>{{ 'Edit fragrance' if product else 'Add fragrance' }}</h1><label>Product name<input name="name" value="{{ product.name if product else '' }}" required></label><label>URL slug<input name="slug" value="{{ product.slug if product else '' }}" required pattern="[a-z0-9-]+"></label><label>Description<textarea name="description" rows="4">{{ product.description if product else '' }}</textarea></label><div class="form-two"><label>SKU<input name="sku" value="{{ product.sku if product else '' }}" placeholder="BANS-001"></label><label>Category<input name="category_name" value="{{ product.category_name if product else 'Signature' }}" placeholder="Signature"></label></div><label>Gender<select name="gender"><option {% if product and product.gender=='Unisex' %}selected{% endif %}>Unisex</option><option {% if product and product.gender=='Men' %}selected{% endif %}>Men</option><option {% if product and product.gender=='Women' %}selected{% endif %}>Women</option></select></label><div class="form-two"><label>Price (INR)<input name="price" type="number" min="1" step=".01" value="{{ product.price if product else '' }}" required></label><label>MRP (INR)<input name="mrp" type="number" min="1" step=".01" value="{{ product.mrp if product else '' }}" required></label></div><label>Stock<input name="stock" type="number" min="0" value="{{ product.stock if product else 0 }}" required></label><label>Product image (JPG, PNG, WebP · max 5 MB)<input name="image" type="file" accept=".jpg,.jpeg,.png,.webp"></label>{% if product and product.image %}<p class="current-image">Current image <img src="{{ url_for('static',filename=product.image) }}" alt=""></p>{% endif %}<label>Fragrance family<input name="fragrance_family" value="{{ product.fragrance_family if product else '' }}" placeholder="Woody, Floral, Fresh..."></label><label>Available sizes<input name="available_sizes" value="{{ product.available_sizes if product else '50ml, 100ml' }}"></label><label>Product video URL (optional)<input name="video_url" value="{{ product.video_url if product else '' }}"></label><label>Top notes<input name="top" value="{{ product.notes_top if product else '' }}"></label><label>Heart notes<input name="heart" value="{{ product.notes_heart if product else '' }}"></label><label>Base notes<input name="base" value="{{ product.notes_base if product else '' }}"></label><div class="check-row"><label><input type="checkbox" name="featured" {% if product and product.is_featured %}checked{% endif %}> Featured</label><label><input type="checkbox" name="bestseller" {% if product and product.is_bestseller %}checked{% endif %}> Bestseller</label><label><input type="checkbox" name="new" {% if product and product.is_new %}checked{% endif %}> New arrival</label></div><button class="btn">Save product</button><a class="text-link" href="{{ url_for('admin.products') }}">Cancel</a></form></section>{% endblock %}
