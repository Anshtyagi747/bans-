{% extends "admin/layout.html" %}{% block admin_content %}<div class="admin-heading"><div><p class="eyebrow">CATALOGUE STRUCTURE</p><h1>Categories <em>studio.</em></h1></div></div><section class="admin-panel"><h2>Add category</h2><form method="post" class="admin-inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" placeholder="Category name" required><input name="slug" placeholder="url-slug" required><button class="btn">Add category</button></form></section><section class="admin-panel"><table><tr><th>Name</th><th>Slug</th><th>Action</th></tr>{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.slug }}</td><td><form method="post" action="{{ url_for('admin.delete_category',category_id=c.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-link">Delete</button></form></td></tr>{% else %}<tr><td colspan="3">No categories yet.</td></tr>{% endfor %}</table></section>{% endblock %}
