{% extends 'admin/layout.html' %}{% block admin_content %}<div class="admin-heading"><div><p class="eyebrow">STORE CONTROL</p><h1>Website & <em>shipping.</em></h1><p>Changes here are used by the storefront without editing code.</p></div></div>
<section class="admin-panel"><form method="post" class="wide-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<h2>Homepage content</h2><label>Announcement bar<input name="announcement" value="{{ values.announcement }}"></label><label>Hero headline<input name="hero_title" value="{{ values.hero_title }}"></label><label>Hero subtitle<textarea name="hero_subtitle" rows="2">{{ values.hero_subtitle }}</textarea></label>
<h2>Contact & social</h2><label>Contact email<input type="email" name="contact_email" value="{{ values.contact_email }}"></label><label>Contact phone<input name="contact_phone" value="{{ values.contact_phone }}"></label><label>Instagram URL<input name="instagram_url" value="{{ values.instagram_url }}"></label>
<h2>Shipping & payment options</h2><div class="form-two"><label>Shipping charge (₹)<input type="number" min="0" step="1" name="shipping_charge" value="{{ values.shipping_charge }}"></label><label>Free shipping above (₹)<input type="number" min="0" step="1" name="free_shipping_threshold" value="{{ values.free_shipping_threshold }}"></label><label>COD advance (₹)<input type="number" min="1" step="1" name="cod_advance" value="{{ values.cod_advance }}"></label></div><div class="check-row"><label><input type="checkbox" name="cod_enabled" {% if cod_enabled %}checked{% endif %}> Enable COD</label><label><input type="checkbox" name="online_enabled" {% if online_enabled %}checked{% endif %}> Enable online payment</label></div><button class="btn">Save store settings</button></form></section>{% endblock %}
