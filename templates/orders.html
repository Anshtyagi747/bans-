{% extends "base.html" %}{% block content %}<section class="page-hero"><p class="eyebrow">YOUR HISTORY</p><h1>Orders.</h1></section><section class="section">{% for o in orders %}<div class="order-row"><a href="{{ url_for('order_confirmation', order_id=o.id) }}">Order #BANS-{{ '%05d'|format(o.id) }}</a> · {{ o.created_at.strftime('%d %b %Y') }} · {{ o.status }} · {{ o.payment_method }} <b>₹{{ '%.2f'|format(o.total) }}</b></div>{% else %}<p>No orders yet.</p>{% endfor %}</section>{% endblock %}
